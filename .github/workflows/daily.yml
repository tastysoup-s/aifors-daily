name: ai4s-daily

on:
  schedule:
    # Report periods and slot decisions use UTC throughout the application.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai4s-daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AI4S_DB: data/ai4s.db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare persistent data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf data-branch
          mkdir data-branch
          cd data-branch
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout -q -b data origin/data
            echo "Restored data branch."
          else
            git checkout -q --orphan data
            git rm -rfq . 2>/dev/null || true
            echo "Data branch missing; it will be created after a successful run."
          fi

      - name: Restore production database
        run: |
          mkdir -p data docs
          if [ -f data-branch/data/ai4s.db ]; then
            cp data-branch/data/ai4s.db "$AI4S_DB"
          fi

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main fetch --db "$AI4S_DB"

      - name: Analyze AI4S items
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main analyze --db "$AI4S_DB"

      - name: Summarize high-scoring AI4S items
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main summarize-ai4s --db "$AI4S_DB"

      - name: Generate daily report
        run: python -m src.main generate-daily --db "$AI4S_DB" --report-date "$(date -u +%F)"

      - name: Generate Wednesday or Sunday weekly report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          weekday="$(date -u +%u)"
          if [ "$weekday" = "3" ] || [ "$weekday" = "7" ]; then
            python -m src.main generate-weekly --db "$AI4S_DB" --report-date "$(date -u +%F)"
          else
            echo "Not a Wednesday/Sunday UTC slot; skipping weekly report."
          fi

      - name: Render AI4S reports
        run: |
          python -m src.main render-ai4s --db "$AI4S_DB" --output-dir docs
          test -s docs/index.html

      - name: Persist database and published site
        run: |
          set -euo pipefail
          mkdir -p data-branch/data
          cp "$AI4S_DB" data-branch/data/ai4s.db
          rm -rf data-branch/docs
          cp -r docs data-branch/docs
          cd data-branch
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ai4s.db docs
          if git diff --cached --quiet; then
            echo "No persistent state changes to commit."
          else
            git commit -m "ai4s update $(date -u +%Y-%m-%d)"
            git push -u origin data
          fi
