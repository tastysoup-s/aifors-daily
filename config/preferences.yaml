# 用户偏好。在 fork 中改这个文件。
keywords:
  - AI for Science
  - scientific machine learning
  - protein design
  - drug discovery
  - computational biology
  - molecular generation
  - reaction prediction
  - materials discovery
  - scientific foundation model
  - weather forecasting
  - climate modeling
  - scientific agent

# 抓取窗口（小时）。默认抓最近 7 天的内容——
# AI Lab 博客（OpenAI/DeepMind/HuggingFace）发布频率低，36h 窗口会系统性卡掉，
# 7 天窗口配合 SQLite URL 去重，多抓的部分不会进新数据。
fetch_window_hours: 168

# LLM 选型。本 fork 统一使用 DeepSeek 省钱预设。
# 其他预设见 README:
#   省钱党:   scorer=deepseek/deepseek-chat  summarizer=deepseek/deepseek-chat
#   品质党:   scorer=anthropic/claude-sonnet-4-6 summarizer=anthropic/claude-opus-4-7
#   中文混搭: scorer=deepseek/deepseek-chat  summarizer=anthropic/claude-sonnet-4-6
models:
  scorer:     deepseek/deepseek-chat
  summarizer: deepseek/deepseek-chat

# 评分阈值：score >= score_threshold 的内容才进入总结阶段。
score_threshold: 7

# 推送 top N（Stage 3 用）。
top_n: 10
