# AI4S-Daily V2: balanced discovery; Analyzer decides the actual domain.
sources:
  - name: arxiv-ai-methods
    type: arxiv
    group: papers
    provider: arXiv
    categories: [cs.AI, cs.LG, stat.ML]
    terms: [AI for science, scientific machine learning, molecular, protein, materials discovery, chemistry, physics, climate, weather, geoscience]
    max_results: 15

  - name: arxiv-biology-medicine
    type: arxiv
    group: papers
    provider: arXiv
    categories: [q-bio.BM, q-bio.GN, q-bio.QM]
    terms: &ai_terms [machine learning, deep learning, neural network, foundation model, graph neural network, generative model, diffusion model, surrogate model, scientific machine learning, physics-informed, machine-learned potential, neural potential, AI-driven discovery, inverse design, generative design]
    max_results: 8

  - name: arxiv-chemistry
    type: arxiv
    group: papers
    provider: arXiv
    categories: [physics.chem-ph]
    terms: *ai_terms
    max_results: 20

  - name: arxiv-materials
    type: arxiv
    group: papers
    provider: arXiv
    categories: [cond-mat.mtrl-sci]
    terms: *ai_terms
    max_results: 20

  - name: arxiv-physics
    type: arxiv
    group: papers
    provider: arXiv
    categories: [physics.comp-ph, astro-ph.IM, hep-ex, quant-ph]
    terms: *ai_terms
    max_results: 20

  - name: arxiv-earth
    type: arxiv
    group: papers
    provider: arXiv
    categories: [physics.ao-ph, physics.geo-ph]
    terms: *ai_terms
    max_results: 20

  - name: biorxiv-ai4s
    type: rss
    group: preprints
    provider: bioRxiv
    max_results: 10
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=bioinformatics+genomics"

  - name: medrxiv-ai4s
    type: rss
    group: preprints
    provider: medRxiv
    max_results: 10
    url: "https://connect.medrxiv.org/medrxiv_xml.php?subject=health_informatics+genetic_and_genomic_medicine"

  # ── Code / Open-source：已核验且数量可控的 AI4S Topics ──
  - name: github-ai-for-science
    type: github
    group: code
    provider: GitHub
    max_results: 15
    topic: ai-for-science
    min_stars: 20

  - name: github-drug-discovery
    type: github
    group: code
    provider: GitHub
    max_results: 10
    topic: drug-discovery
    min_stars: 100

  - name: github-protein-design
    type: github
    group: code
    provider: GitHub
    max_results: 10
    topic: protein-design
    min_stars: 20

  - name: github-materials-informatics
    type: github
    group: code
    provider: GitHub
    max_results: 15
    topic: materials-informatics
    required_topics: [machine-learning]
    min_stars: 20

  - name: github-chemistry
    type: github
    group: code
    provider: GitHub
    topic: molecular-machine-learning
    min_stars: 20
    max_results: 15

  - name: github-physics
    type: github
    group: code
    provider: GitHub
    topic: physics-informed-neural-networks
    min_stars: 20
    max_results: 15

  - name: github-earth
    type: github
    group: code
    provider: GitHub
    topic: weather-forecasting
    required_topics: [machine-learning]
    min_stars: 20
    max_results: 15

  # ── Research Labs：官方研究机构 / 平台 RSS ──
  - name: deepmind-blog
    type: rss
    group: research_labs
    provider: Google DeepMind
    url: https://deepmind.google/blog/rss.xml

  - name: nvidia-dev-blog
    type: rss
    group: research_labs
    provider: NVIDIA
    url: https://developer.nvidia.com/blog/feed/

  - name: microsoft-research
    type: rss
    group: research_labs
    provider: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/

  - name: apple-ml-research
    type: rss
    group: research_labs
    provider: Apple ML Research
    url: https://machinelearning.apple.com/rss.xml

  # ── Community Signals：高分门槛，避免通用 AI 新闻占据主池 ──
  - name: hackernews-ai-science
    type: hackernews
    group: community
    provider: Hacker News
    query: "AI science"
    min_points: 100

  # Optional: seven calls per run, five results per query; no automatic retry.
  - name: tavily-ai4s-discovery
    type: tavily
    group: search
    provider: Tavily (discovery)
    max_results: 5
    queries:
      biology: machine learning computational biology genomics protein design single cell scientific research
      medicine: AI medical research medical imaging clinical prediction drug discovery biomedical foundation model
      chemistry: machine learning chemistry molecular design reaction prediction computational chemistry
      materials: AI materials science materials discovery crystal property prediction materials informatics
      physics: machine learning physics scientific simulation surrogate model PDE particle quantum research
      earth: AI climate weather forecasting geoscience earth observation scientific machine learning
      general: AI for science scientific discovery foundation model scientific computing autonomous laboratory
